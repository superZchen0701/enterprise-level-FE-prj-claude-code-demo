schema: spec-driven

# 项目基本信息
name: fe-vue3-demo
description: |
  前端 Vue 3 移动端示例项目，使用 OpenSpec 工作流开发。
  当前已实现兑换记录列表页面，支持 Mock 数据切换。

context: |
  ## 技术栈
  - Vue 3.5.x - 渐进式 JavaScript 框架（Composition API）
  - Vue Router 4.x - 官方路由管理器
  - Vant 4.x - 移动端 Vue 组件库
  - TypeScript 5.5.x - 类型安全
  - Vite 6.x - 构建工具
  - ESLint 8.x - 代码规范检查
  - vue-tsc 2.x - TypeScript 类型检查

  ## 项目结构
  ```
  src/
  ├── api/                    # API 接口封装
  │   └── exchange.ts         # 兑换模块接口（查询、提交兑换记录）
  │
  ├── assets/                 # 静态资源
  │   └── logo.png            # 项目 Logo
  │
  ├── mock/                   # Mock 数据
  │   ├── exchangeData.ts     # 兑换记录 mock 数据、状态枚举、分页/筛选工具
  │   └── index.ts            # mock 模块统一导出
  │
  ├── router/                 # 路由配置
  │   └── index.ts            # 路由定义（当前：/exchange-record）
  │
  ├── utils/                  # 工具函数
  │   └── request.ts          # HTTP 请求封装（fetch + 超时控制 + 统一错误处理）
  │
  ├── views/                  # 页面视图组件
  │   └── ExchangeRecord.vue  # 兑换记录列表页面
  │
  ├── components/             # 公共组件（当前暂无）
  │
  ├── App.vue                 # 根组件
  └── main.ts                 # 入口文件（引入 Vant 组件、挂载 Vue 应用）
  ```

  ### 目录职责详解

  **api/** - 按业务模块组织接口文件，支持 `VITE_USE_MOCK` 环境变量切换真实/Mock 数据

  **components/** - 存放可复用的公共组件，当前项目暂无公共组件

  **mock/** - 开发阶段模拟后端数据，导出枚举、mock 数据、辅助函数（分页、筛选）

  **router/** - Vue Router 配置，使用 `createWebHistory` 模式，支持路由懒加载

  **utils/** - request.ts 基于 fetch API 统一封装，支持超时控制、类型泛型、错误处理

  **views/** - 页面级组件，与路由一一对应，样式使用 scoped + :deep() 覆盖 Vant 样式

  ## 编码规范
  - 使用单引号字符串
  - 组件名使用 PascalCase（如 ExchangeRecord）
  - 文件命名：组件文件 PascalCase（.vue），TS 文件 camelCase（.ts）
  - Vue 组件使用 `<script setup lang="ts">` Composition API 风格
  - Props 使用 TypeScript 泛型 + `withDefaults`：`defineProps<Props>()`
  - Emits 使用 TypeScript 泛型：`defineEmits<{ event: [arg: Type] }>()`
  - API 函数使用 JSDoc 注释
  - 类型定义使用 `interface`，公共类型通过 `export type` 导出
  - scoped CSS 使用 :deep() 穿透样式
  - 函数参数和返回值必须显式声明类型
  - 导入顺序：Vue 核心 → 类型导入 → UI 组件 → 本地模块

  ## 开发约定
  - 组件名使用多词组合，避免与 HTML 元素冲突
  - API 接口统一放在 api/ 目录，按功能模块组织
  - 工具函数统一放在 utils/ 目录
  - Mock 数据通过环境变量 VITE_USE_MOCK 控制
  - 样式使用 scoped，组件级样式隔离
  - 移动端适配使用 Vant 组件库

  ## 数据规范
  - 后端返回格式：`{ code: number, data: unknown, message: string }`
  - code 为 0 或 200 表示成功
  - API 请求封装在 utils/request.ts，支持泛型返回类型

  ## 开发命令
  - pnpm run dev - 启动开发服务（默认开启 mock）
  - pnpm run build - 生产构建
  - pnpm run lint - 代码检查与修复
  - pnpm run typecheck - TypeScript 类型检查

  ## 环境变量
  - .env.development - 开发环境（VITE_USE_MOCK=true）
  - .env.production - 生产环境（VITE_USE_MOCK=false）
  - VITE_API_BASE_URL - API 基础地址

rules:
  proposal:
    - 提案使用中文撰写，保持简洁清晰
    - 包含目标、非目标、技术方案概述
    - 评估对现有功能的影响范围
  design:
    - 组件设计遵循 Vue 3 Composition API 风格（`<script setup>`）
    - 明确 props、ref、reactive、computed、生命周期
    - 考虑移动端适配和 Vant 4 组件使用
  tasks:
    - 任务按功能模块拆分，单个任务控制在 2 小时内
    - 每个任务包含明确的验收标准
    - 优先处理核心功能，UI 优化可后置
  spec:
    - API 接口文档包含请求/响应格式
    - 组件文档包含 props 和事件说明
    - 标注需要 mock 的数据结构
